name: Green CI/CD Pipeline with Energy and CO2 Measurement

on:
  push:
    branches: [ "main" ]

jobs:
  measure-energy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code from Repository
        uses: actions/checkout@v4

      - name: Start Eco-CI Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: start-measurement

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Measure Dependency Step
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: get-measurement
          label: "Dependency Install"

      - name: Run Automated Tests (CI Stage)
        run: npm test

      - name: Measure Test Step
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: get-measurement
          label: "Automated Testing"

      - name: Show Total Energy and CO2 Summary
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: display-results
          calculate-co2: true
